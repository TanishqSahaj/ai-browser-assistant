<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Calendar</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 640px; margin: 40px auto; color: #222; padding: 0 20px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h2 { font-size: 15px; margin-top: 28px; }
    p.sub { color: #666; font-size: 13px; margin-top: 0; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; font-size: 13px; cursor: pointer; border: none; border-radius: 4px; background: #4f46e5; color: white; margin-right: 8px; margin-top: 10px; }
    button.secondary { background: #eee; color: #333; }
    .event { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 8px; background: #fafafa; }
    .event-title { font-weight: 600; font-size: 14px; }
    .event-time { color: #666; font-size: 12px; margin-top: 2px; }
    .event-loc { color: #888; font-size: 12px; margin-top: 2px; }
    #preview { border: 1px solid #c7d2fe; background: #eef2ff; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 13px; display: none; }
    #status { font-size: 13px; color: #666; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Calendar</h1>
  <p class="sub">Upcoming events, and quick add from plain English.</p>
  <h2>Quick add</h2>
  <input type="text" id="quickAdd" placeholder="lunch with Priya next Tuesday at 1pm" />
  <button id="parseBtn">Preview</button>
  <div id="preview"></div>
  <div id="status"></div>
  <h2>Next 7 days</h2>
  <button id="refreshBtn" class="secondary">Refresh</button>
  <div id="events">Loading…</div>
  <script src="calendar-page.js"></script>
</body>
</html>
