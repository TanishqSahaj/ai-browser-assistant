<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Test Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 6px; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Sample Internship Application</h2>
  <form>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="fullname" />

    <label for="email_field">Email Address</label>
    <input type="email" id="email_field" name="email" />

    <label for="phone_field">Phone Number</label>
    <input type="text" id="phone_field" name="phone" />

    <label for="uni">University</label>
    <input type="text" id="uni" name="university" />

    <label>LinkedIn Profile</label>
    <input type="text" placeholder="LinkedIn URL" />

    <label>Your GitHub username</label>
    <input type="text" placeholder="e.g. octocat" />
  </form>
</body>
</html>
