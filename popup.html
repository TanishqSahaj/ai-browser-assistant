<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, Arial, sans-serif;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    #result {
      margin-top: 12px;
      font-size: 12px;
      color: #333;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>AI Browser Assistant</h2>
  <button id="scanBtn" style="background:#4f46e5; color:white; margin-bottom: 8px;">Scan &amp; Fill This Page</button>
  <button id="summarizeBtn" style="background:#0891b2; color:white; margin-bottom: 8px;">Summarize This Page</button>
  <button id="pingBtn" style="background:#eee; color:#333;">Get current page title</button>
  <div id="result">Pick an action →</div>

  <hr style="margin: 14px 0; border: none; border-top: 1px solid #eee;" />
  <a href="#" id="openProfile" style="font-size: 12px;">Edit my profile →</a>

  <script src="popup.js"></script>
</body>
</html>
